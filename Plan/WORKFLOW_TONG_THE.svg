<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Workflow tổng thể — Hệ thống AI tạo nội dung marketing BĐS đa kênh</text>
  <text x="640" y="68" text-anchor="middle" font-size="15" fill="#64748B">Retrieval-grounded controllable generation · mọi claim đều có nguồn · ĐATN UIT 2026</text>

  <!-- ===== Lane 1: DU LIEU & TRI THUC ===== -->
  <rect x="40" y="95" width="1200" height="170" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="60" y="122" font-size="14" font-weight="700" fill="#0369A1">TẦNG DỮ LIỆU &amp; TRI THỨC</text>

  <rect x="60" y="140" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="165" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Kho DataBDS (raw)</text>
  <text x="165" y="188" text-anchor="middle" font-size="12.5" fill="#334155">4.795 tin · 37.349 ảnh local</text>
  <text x="165" y="206" text-anchor="middle" font-size="12.5" fill="#334155">provenance: URL + hash</text>
  <text x="165" y="224" text-anchor="middle" font-size="12.5" fill="#64748B">bất biến, không sửa tay</text>

  <rect x="310" y="140" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="415" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Pipeline làm sạch D1–D5</text>
  <text x="415" y="188" text-anchor="middle" font-size="12.5" fill="#334155">re-parse · chuẩn hóa · dedup</text>
  <text x="415" y="206" text-anchor="middle" font-size="12.5" fill="#334155">quarantine lỗi · idempotent</text>
  <text x="415" y="224" text-anchor="middle" font-size="12.5" fill="#64748B">script hóa, tái lập được</text>

  <rect x="560" y="140" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="665" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Canonical facts</text>
  <text x="665" y="188" text-anchor="middle" font-size="12.5" fill="#334155">mỗi fact: source_id + trích đoạn</text>
  <text x="665" y="206" text-anchor="middle" font-size="12.5" fill="#334155">valid_from / valid_to</text>
  <text x="665" y="224" text-anchor="middle" font-size="12.5" fill="#64748B">confidence + needs_review</text>

  <rect x="810" y="140" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="920" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Property Knowledge Graph</text>
  <text x="920" y="188" text-anchor="middle" font-size="12.5" fill="#334155">PostgreSQL · ontology cố định</text>
  <text x="920" y="206" text-anchor="middle" font-size="12.5" fill="#334155">traversal ≤ 2 hop (CTE)</text>
  <text x="920" y="224" text-anchor="middle" font-size="12.5" fill="#64748B">+ pgvector · FTS index</text>

  <rect x="1070" y="140" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1145" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Visual facts</text>
  <text x="1145" y="188" text-anchor="middle" font-size="12.5" fill="#334155">VLM trích xuất hẹp</text>
  <text x="1145" y="206" text-anchor="middle" font-size="12.5" fill="#334155">+ người xác nhận</text>
  <text x="1145" y="224" text-anchor="middle" font-size="12.5" fill="#64748B">(Tuần 7)</text>

  <line x1="270" y1="190" x2="308" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="190" x2="558" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="190" x2="808" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070" y1="190" x2="1032" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Lane 2: NGUOI DUNG ===== -->
  <rect x="40" y="295" width="1200" height="130" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="60" y="322" font-size="14" font-weight="700" fill="#4338CA">NGƯỜI DÙNG (Web App · Auth + RBAC: admin / marketer / reviewer)</text>

  <rect x="60" y="336" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="175" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">1. Chọn dự án BĐS</text>
  <text x="175" y="384" text-anchor="middle" font-size="12.5" fill="#334155">facts · units · ảnh · nguồn</text>

  <rect x="330" y="336" width="270" height="72" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="465" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">2. Lập brief nội dung</text>
  <text x="465" y="384" text-anchor="middle" font-size="12.5" fill="#334155">kênh (4) · persona (3) · brand · SEO</text>

  <rect x="640" y="336" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="780" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">7. Review draft + Evidence</text>
  <text x="780" y="384" text-anchor="middle" font-size="12.5" fill="#334155">claim → fact → nguồn → graph path</text>

  <rect x="960" y="336" width="260" height="72" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="1090" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">8. Duyệt · Version · Export</text>
  <text x="1090" y="384" text-anchor="middle" font-size="12.5" fill="#334155">audit log · feedback (tầng T4)</text>

  <line x1="290" y1="372" x2="328" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="372" x2="958" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Lane 3: AI CORE ===== -->
  <rect x="40" y="455" width="1200" height="170" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="60" y="482" font-size="14" font-weight="700" fill="#C2410C">LÕI AI — SINH CÓ KIỂM SOÁT</text>

  <rect x="60" y="500" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="160" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">3. Query Router</text>
  <text x="160" y="548" text-anchor="middle" font-size="12.5" fill="#334155">fact đơn · quan hệ</text>
  <text x="160" y="566" text-anchor="middle" font-size="12.5" fill="#334155">1–2 hop · mixed</text>

  <rect x="300" y="500" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="435" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">4. Hybrid Retrieval (R3)</text>
  <text x="435" y="548" text-anchor="middle" font-size="12.5" fill="#334155">FTS + vector + graph traversal</text>
  <text x="435" y="566" text-anchor="middle" font-size="12.5" fill="#334155">hợp nhất RRF · filter project/tenant</text>
  <text x="435" y="586" text-anchor="middle" font-size="12.5" fill="#64748B">→ chunks + paths + provenance</text>

  <rect x="610" y="500" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="750" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">5. Generator (A–D)</text>
  <text x="750" y="548" text-anchor="middle" font-size="12.5" fill="#334155">A prompt-only · B RAG · C QLoRA</text>
  <text x="750" y="566" text-anchor="middle" font-size="12.5" fill="#334155">D RAG + QLoRA (production)</text>
  <text x="750" y="586" text-anchor="middle" font-size="12.5" fill="#64748B">output JSON: claims[] → fact_id</text>

  <rect x="930" y="500" width="290" height="100" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="1075" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">6. Critic → Refine ≤ 1 vòng</text>
  <text x="1075" y="548" text-anchor="middle" font-size="12.5" fill="#334155">rule engine + LLM judge độc lập</text>
  <text x="1075" y="566" text-anchor="middle" font-size="12.5" fill="#334155">factuality · brand · kênh · SEO</text>
  <text x="1075" y="586" text-anchor="middle" font-size="12.5" fill="#DC2626">claim không căn cứ → loại / cảnh báo</text>

  <line x1="260" y1="550" x2="298" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="550" x2="608" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="550" x2="928" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Lane 4: EVALUATION ===== -->
  <rect x="40" y="655" width="1200" height="130" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="60" y="682" font-size="14" font-weight="700" fill="#047857">TẦNG ĐÁNH GIÁ THỰC NGHIỆM (tái lập được)</text>

  <rect x="60" y="696" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="240" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Benchmark A–D + R1–R3</text>
  <text x="240" y="744" text-anchor="middle" font-size="12.5" fill="#334155">frozen test 40–60 briefs · 60–90 queries · cùng seed</text>

  <rect x="460" y="696" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="640" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Metric tự động + Human eval mù</text>
  <text x="640" y="744" text-anchor="middle" font-size="12.5" fill="#334155">fact precision · unsupported claim · fit · kappa · effect size</text>

  <rect x="860" y="696" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="1040" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Experiment Dashboard</text>
  <text x="1040" y="744" text-anchor="middle" font-size="12.5" fill="#334155">so sánh cấu hình · latency/cost · snapshot version</text>

  <line x1="420" y1="732" x2="458" y2="732" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="732" x2="858" y2="732" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Cross-lane arrows ===== -->
  <!-- Facts/graph -> retrieval -->
  <path d="M 920 240 L 920 275 L 435 275 L 435 498" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="640" y="270" text-anchor="middle" font-size="12" fill="#0369A1">facts + graph + index phục vụ truy xuất</text>

  <!-- Brief -> router -->
  <path d="M 465 408 L 465 435 L 160 435 L 160 498" fill="none" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="430" text-anchor="middle" font-size="12" fill="#4338CA">brief</text>

  <!-- Critic -> review -->
  <path d="M 1075 500 L 1075 445 L 780 445 L 780 410" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="930" y="440" text-anchor="middle" font-size="12" fill="#C2410C">draft + evidence + warnings</text>

  <!-- Generation runs -> evaluation -->
  <path d="M 750 600 L 750 630 L 240 630 L 240 694" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="490" y="626" text-anchor="middle" font-size="12" fill="#047857">mọi run được log: model · prompt · data · graph version + seed</text>

  <!-- Guardrail note -->
  <rect x="40" y="805" width="1200" height="70" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="640" y="833" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B91C1C">Nguyên tắc xuyên suốt: không có fact nguồn → không có claim · dữ liệu hết hiệu lực không vào prompt · mọi kết quả thí nghiệm tái lập từ script</text>
  <text x="640" y="856" text-anchor="middle" font-size="12.5" fill="#7F1D1D">Chi tiết: Plan/01 (kiến trúc) · Plan/02 (dữ liệu) · Plan/03 (thực nghiệm) · Plan/04 (bảo vệ)</text>
</svg>
