services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cancu-db
    environment:
      POSTGRES_USER: cancu
      POSTGRES_PASSWORD: cancu_dev
      POSTGRES_DB: cancu
    ports:
      - "5432:5432"
    volumes:
      - cancu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancu -d cancu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cancu_pgdata:
